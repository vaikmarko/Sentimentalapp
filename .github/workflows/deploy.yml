# Production deploy: API to Cloud Run, web to Firebase Hosting.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   GCP_SA_KEY            service-account JSON with Cloud Run + Artifact Registry +
#                         Secret Manager admin roles (deploy/setup_deploy_credentials.sh)
#   FIREBASE_SA_KEY       service-account JSON with Firebase Hosting admin
#   OPENAI_API_KEY        required; synced into Secret Manager and mounted on Cloud Run
#
# Runs on main only when these secrets exist; otherwise skips quietly so CI
# stays green for forks/before infra is provisioned.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: creds
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          # Secret is passed via env: inlining ${{ secrets.* }} into the script
          # breaks on multiline JSON values.
          if [ -n "$GCP_SA_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GCP_SA_KEY not configured - skipping API deploy"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: google-github-actions/auth@v2
        if: steps.creds.outputs.available == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.creds.outputs.available == 'true'
      - name: Sync OpenAI key into Secret Manager
        if: steps.creds.outputs.available == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROJECT: sentimental-f95e6
          SECRET: openai-api-key
        run: |
          # Production never runs with fake providers: fail loudly instead of
          # serving canned stories to real people.
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY secret is not configured - refusing to deploy production API"
            exit 1
          fi
          if ! gcloud secrets describe "$SECRET" --project "$PROJECT" >/dev/null 2>&1; then
            gcloud secrets create "$SECRET" --project "$PROJECT" --replication-policy automatic --quiet
          fi
          # Only add a version when the value changed, so the secret history stays readable.
          CURRENT="$(gcloud secrets versions access latest --secret "$SECRET" --project "$PROJECT" 2>/dev/null || true)"
          if [ "$CURRENT" != "$OPENAI_API_KEY" ]; then
            printf '%s' "$OPENAI_API_KEY" | gcloud secrets versions add "$SECRET" --project "$PROJECT" --data-file=- --quiet
          fi
          # Cloud Run's runtime service account must be allowed to read it.
          PROJECT_NUMBER="$(gcloud projects describe "$PROJECT" --format 'value(projectNumber)')"
          gcloud secrets add-iam-policy-binding "$SECRET" --project "$PROJECT" \
            --member "serviceAccount:${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
            --role roles/secretmanager.secretAccessor --quiet >/dev/null
      - name: Deploy to Cloud Run
        if: steps.creds.outputs.available == 'true'
        run: |
          # The key is mounted from Secret Manager, never written into env-var
          # config where it would be visible on every revision.
          gcloud run deploy sentimental-api-v2 \
            --source api \
            --region europe-west1 \
            --project sentimental-f95e6 \
            --allow-unauthenticated \
            --set-env-vars "ENVIRONMENT=production,APP_VERSION=${GITHUB_SHA::8},STORAGE_MODE=gcs,FAKE_PROVIDERS=false" \
            --update-secrets "OPENAI_API_KEY=openai-api-key:latest" \
            --quiet

  web:
    # Hosting rewrite references the Cloud Run service, so the API must exist
    # before the web deploy validates the config.
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy credentials
        id: creds
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          # Secret is passed via env: inlining ${{ secrets.* }} into the script
          # breaks on multiline JSON values.
          if [ -n "$FIREBASE_SA_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::FIREBASE_SA_KEY not configured - skipping web deploy"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        if: steps.creds.outputs.available == 'true'
        working-directory: web
        env:
          # Repository variable (Settings -> Variables), e.g. "sentimentalapp.com".
          # Unset = analytics stays off.
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
        run: npm ci && npm run build && rm -rf ../deploy/dist && cp -r dist ../deploy/dist
      - name: Deploy to Firebase Hosting (staging site sentimentalapp-test)
        if: steps.creds.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SA_KEY }}
          channelId: live
          projectId: sentimental-f95e6
          entryPoint: deploy
          target: sentimentalapp-test
      - name: Deploy to Firebase Hosting (production site, sentimentalapp.com)
        if: steps.creds.outputs.available == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SA_KEY }}
          channelId: live
          projectId: sentimental-f95e6
          entryPoint: deploy
          target: production
